name: Build Marsh IP APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/marsh/ip app/src/main/assets app/src/main/res/drawable app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MarshIP"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.marsh.ip'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.marsh.ip'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '3.0'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:label="Marsh IP"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          if [ ! -f marsh_icon.png ]; then
            echo "ERROR: Upload the supplied app icon to the repository root as marsh_icon.png"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert marsh_icon.png -resize 48x48^ -gravity center -extent 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert marsh_icon.png -resize 72x72^ -gravity center -extent 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert marsh_icon.png -resize 96x96^ -gravity center -extent 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert marsh_icon.png -resize 144x144^ -gravity center -extent 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert marsh_icon.png -resize 192x192^ -gravity center -extent 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cat > app/src/main/java/com/marsh/ip/MainActivity.java <<'EOF'
          package com.marsh.ip;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setLoadsImagesAutomatically(true);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }
              @Override public void onBackPressed() {
                  WebView web = (WebView) findViewById(android.R.id.content).getRootView();
                  super.onBackPressed();
              }
          }
          EOF
          cat > app/src/main/assets/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
          <meta name="theme-color" content="#101827">
          <title>Marsh IP</title>
          <style>
          :root{color-scheme:dark;--bg:#0b1220;--panel:#121e30;--text:#edf5ff;--muted:#9aabc1;--accent:#54d6c8;--line:#26364c}
          body.light{color-scheme:light;--bg:#edf3f8;--panel:#fff;--text:#172235;--muted:#607086;--accent:#087f78;--line:#d7e0ea}
          *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#1a3850 0,transparent 35%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif;min-height:100vh}
          .wrap{max-width:720px;margin:auto;padding:22px 16px 38px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:25px;font-weight:850;letter-spacing:.3px}.brand span{color:var(--accent)}button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;padding:11px 14px;font-weight:650;cursor:pointer}
          .hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;margin:13px 0;box-shadow:0 12px 32px #0002}.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1.4px}.ip{font-size:clamp(26px,7vw,42px);font-weight:850;overflow-wrap:anywhere;margin:8px 0}.status{color:var(--accent);font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.primary{background:var(--accent);color:#06201e;border:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.item{background:color-mix(in srgb,var(--panel),var(--bg) 25%);border:1px solid var(--line);border-radius:15px;padding:13px;min-width:0}.k{color:var(--muted);font-size:12px;margin-bottom:7px}.v{font-weight:700;overflow-wrap:anywhere}.wide{grid-column:1/-1}.map{display:block;text-align:center;text-decoration:none;color:var(--accent);padding:12px;border:1px solid var(--line);border-radius:13px;margin-top:12px}.note{color:var(--muted);font-size:12px;line-height:1.6}.meter{height:8px;background:var(--line);border-radius:20px;overflow:hidden;margin-top:10px}.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}.hidden{display:none}@media(max-width:420px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
          </style></head>
          <body><main class="wrap">
          <header class="top"><div class="brand">Marsh <span>IP</span></div><button id="theme">☀️ / 🌙</button></header>
          <section class="hero"><div class="eyebrow">Your public IP address</div><div class="ip" id="ip">Loading…</div><div class="status" id="status">Connecting to IP services…</div>
          <div class="actions" style="margin-top:17px"><button class="primary" id="refresh">↻ Refresh</button><button id="copy">Copy IP</button><button id="share">Share details</button></div></section>
          <section class="card"><div class="eyebrow" style="margin-bottom:14px">Network details</div><div class="grid">
          <div class="item"><div class="k">IPv4</div><div class="v" id="ipv4">—</div></div>
          <div class="item"><div class="k">IPv6</div><div class="v" id="ipv6">Checking…</div></div>
          <div class="item"><div class="k">Country</div><div class="v" id="country">—</div></div>
          <div class="item"><div class="k">Region / City</div><div class="v" id="city">—</div></div>
          <div class="item"><div class="k">Internet provider</div><div class="v" id="isp">—</div></div>
          <div class="item"><div class="k">Timezone</div><div class="v" id="timezone">—</div></div>
          <div class="item"><div class="k">Connection type</div><div class="v" id="connection">Not supported by device</div></div>
          <div class="item"><div class="k">Approx. coordinates</div><div class="v" id="coords">—</div></div>
          </div><a class="map hidden" id="map" target="_blank" rel="noopener">Open approximate location in map ↗</a>
          <p class="note">IP location is an estimate based on your internet provider's network. It does not reveal your exact home address or GPS position.</p></section>
          <section class="card"><div class="eyebrow">Connection speed test</div><p class="note">A small test against Cloudflare. Results are estimates and use a little mobile data.</p>
          <div class="grid"><div class="item"><div class="k">Ping</div><div class="v" id="ping">—</div></div><div class="item"><div class="k">Download</div><div class="v" id="down">—</div></div><div class="item"><div class="k">Upload</div><div class="v" id="up">—</div></div></div>
          <div class="meter"><i id="progress"></i></div><button class="primary" id="speed" style="margin-top:14px">Start speed test</button><div class="note" id="speedStatus" style="margin-top:9px">No test has been run.</div></section>
          <p class="note" style="text-align:center">Marsh IP · Version 3.0</p>
          </main>
          <script>
          const $=id=>document.getElementById(id);let info={};
          async function json(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
          async function getIp(url){try{const d=await json(url);return d.ip||d.ipAddress||null}catch(e){return null}}
          async function load(){
            $('status').textContent='Checking public IP…';$('ip').textContent='Loading…';
            const [v4,v6]=await Promise.all([getIp('https://api.ipify.org?format=json'),getIp('https://api6.ipify.org?format=json')]);
            $('ipv4').textContent=v4||'Unavailable';$('ipv6').textContent=v6||'Not available';$('ip').textContent=v4||v6||'Unavailable';
            let data=null;
            for(const url of ['https://ipwho.is/','https://ipapi.co/json/','https://ipinfo.io/json']){
              try{data=await json(url);if(data&&((data.success!==false)&&(data.country||data.country_name||data.country_name)))break;data=null}catch(e){}
            }
            if(data){
              const country=data.country||data.country_name||'Unknown',code=(data.country_code||data.country||'').toString().toUpperCase();
              const flag=/^[A-Z]{2}$/.test(code)?String.fromCodePoint(...[...code].map(c=>127397+c.charCodeAt(0))):'';
              $('country').textContent=(flag?flag+' ':'')+country;
              $('city').textContent=[data.region||data.region_name,data.city].filter(Boolean).join(' / ')||'Unknown';
              $('isp').textContent=data.connection?.isp||data.org||data.org||data.isp||'Unknown';
              $('timezone').textContent=data.timezone?.id||data.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone||'Unknown';
              let lat=data.latitude,lon=data.longitude;
              if((lat==null||lon==null)&&data.loc){[lat,lon]=data.loc.split(',').map(Number)}
              if(lat!=null&&lon!=null){$('coords').textContent=Number(lat).toFixed(3)+', '+Number(lon).toFixed(3);$('map').href='https://www.openstreetmap.org/?mlat='+lat+'&mlon='+lon+'#map=10/'+lat+'/'+lon;$('map').classList.remove('hidden')}
              info={ip:v4||v6,country,city:$('city').textContent,isp:$('isp').textContent,timezone:$('timezone').textContent,coords:$('coords').textContent};
              $('status').textContent='✓ IP information updated';
            }else{$('status').textContent=(v4||v6)?'IP found · Location service unavailable':'Could not reach IP services. Check internet access.'}
            const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
            if(c)$('connection').textContent=[c.type,c.effectiveType].filter(Boolean).join(' · ')||'Unknown';
          }
          $('refresh').onclick=load;$('copy').onclick=async()=>{const value=$('ip').textContent;if(value&&value!=='Loading…'&&value!=='Unavailable'){try{await navigator.clipboard.writeText(value);$('status').textContent='IP copied'}catch(e){$('status').textContent='Copy is not supported'}}};
          $('share').onclick=()=>{const t=Object.entries(info).map(([k,v])=>k+': '+v).join('\\n');if(navigator.share)navigator.share({title:'Marsh IP',text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>$('status').textContent='Details copied')};
          $('theme').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('marsh-theme',document.body.classList.contains('light')?'light':'dark')};
          if(localStorage.getItem('marsh-theme')==='light')document.body.classList.add('light');
          $('speed').onclick=async()=>{
            const btn=$('speed');btn.disabled=true;$('speedStatus').textContent='Testing…';$('progress').style.width='5%';
            try{
              const t0=performance.now();await fetch('https://www.cloudflare.com/cdn-cgi/trace?x='+Math.random(),{cache:'no-store',mode:'no-cors'});const ping=Math.round(performance.now()-t0);$('ping').textContent=ping+' ms';$('progress').style.width='30%';
              const size=2*1024*1024, start=performance.now();const r=await fetch('https://speed.cloudflare.com/__down?bytes='+size+'&r='+Math.random(),{cache:'no-store'});if(!r.ok)throw Error('Download test unavailable');await r.arrayBuffer();const secs=(performance.now()-start)/1000;$('down').textContent=((size*8/secs)/1e6).toFixed(2)+' Mbps';$('progress').style.width='65%';
              const payload=new Uint8Array(256*1024);crypto.getRandomValues(payload);const u0=performance.now();const up=await fetch('https://speed.cloudflare.com/__up',{method:'POST',body:payload});if(!up.ok)throw Error('Upload test unavailable');await up.text();const us=(performance.now()-u0)/1000;$('up').textContent=((payload.length*8/us)/1e6).toFixed(2)+' Mbps';$('progress').style.width='100%';$('speedStatus').textContent='Test complete · Approximate results';
            }catch(e){$('speedStatus').textContent='Speed test could not finish. The test server may be blocked or unavailable.';$('progress').style.width='0%'}
            btn.disabled=false;
          };
          load();
          </script></body></html>
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marsh-IP-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
