              "COORDINATES":"مختصات","APPROXIMATE LOCATION":"موقعیت تقریبی","IP-based location is approximate, not an exact GPS position or home address.":"موقعیت مبتنی بر آی‌پی تقریبی است و مکان دقیق GPS یا نشانی منزل نیست.",
