          cat > android/app/src/main/java/com/marship/MainActivity.java <<'EOF'
          package com.marship;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
              private WebView web;
              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  web.setOnApplyWindowInsetsListener((v, insets) -> {
                      v.setPadding(insets.getSystemWindowInsetLeft(), insets.getSystemWindowInsetTop(),
                                   insets.getSystemWindowInsetRight(), insets.getSystemWindowInsetBottom());
                      return insets;
                  });
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }
              @Override public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF

          cat > android/app/src/main/assets/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="theme-color" content="#090d18"><title>Marsh IP</title>
          <link rel="stylesheet" href="leaflet.css">
          <style>
          :root{--bg:#090d18;--text:#f8fafc;--muted:#94a3b8;--line:#263247;--c1:#162135;--c2:#0e1523;--item:#0b1322;--item-line:#202d42;--accent:#55d6e8;--btn:#1b2a43;--btn-line:#3a4c69;--blob1:#1d4f8f;--blob2:#2a8a9a;color-scheme:dark}
          [data-theme=light]{--bg:#eef3fa;--text:#0f1b2d;--muted:#5b6b82;--line:#d3dcea;--c1:#ffffff;--c2:#f3f7fd;--item:#f1f5fb;--item-line:#dbe3ef;--accent:#0b8fa8;--btn:#e6eefa;--btn-line:#c3d0e4;--blob1:#9cc3f5;--blob2:#8fe0e8;color-scheme:light}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{margin:0}
          body{min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:18px 16px 96px;transition:background .4s,color .4s}
          .bg{position:fixed;inset:0;overflow:hidden;z-index:-1}
          .bg i{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.35;animation:float 18s ease-in-out infinite alternate}
          .bg i:first-child{background:var(--blob1);top:-160px;left:-120px}
          .bg i:last-child{background:var(--blob2);bottom:-180px;right:-140px;animation-delay:-9s}
          @keyframes float{to{transform:translate(60px,50px) scale(1.15)}}
          main{width:min(100%,620px);margin:0 auto}
          header{text-align:center;margin:6px 0 14px}
          .brand{font-size:clamp(30px,8vw,42px);font-weight:850;letter-spacing:-2px;margin:0}.brand span{color:var(--accent)}
          .sub{color:var(--muted);margin:6px 0 0;font-size:12px;letter-spacing:2px;text-transform:uppercase}
          .tab{display:none}.tab.on{display:block}
          @keyframes in{from{opacity:0;transform:translateY(14px)}}
          .tab.on .card{animation:in .5s ease both}
          .tab.on .card:nth-child(2){animation-delay:.07s}.tab.on .card:nth-child(3){animation-delay:.14s}.tab.on .card:nth-child(4){animation-delay:.21s}
          .card{background:linear-gradient(145deg,var(--c1),var(--c2));border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 18px 50px #0003}
          .eyebrow{font-size:11px;color:var(--muted);letter-spacing:1.8px;font-weight:700;display:flex;align-items:center;gap:8px}
          .tag{background:var(--btn);border:1px solid var(--btn-line);border-radius:6px;padding:2px 7px;font-size:10px;color:var(--accent)}
          .iprow{display:flex;align-items:center;gap:12px;margin-top:10px}
          .ip{font-size:clamp(20px,6vw,30px);font-weight:800;overflow-wrap:anywhere;flex:1}
          .ip.dim{color:var(--muted);font-weight:600;font-size:18px}
          button{border:1px solid var(--btn-line);background:var(--btn);color:var(--text);border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;transition:transform .15s,opacity .2s}
          button:active{transform:scale(.95)}button:disabled{opacity:.5}
          .primary{background:linear-gradient(100deg,#267caa,#4c70d8);border:0;color:#fff}
          .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
          .item{background:var(--item);border:1px solid var(--item-line);border-radius:15px;padding:14px;min-width:0}
          .label{font-size:11px;color:var(--muted);letter-spacing:1.4px;font-weight:700}
          .value{font-size:17px;font-weight:700;margin-top:7px;overflow-wrap:anywhere}
          .wide{grid-column:1/-1}
          .mapbox{position:relative;margin-top:12px}
          .map{height:230px;border-radius:16px;overflow:hidden;border:1px solid var(--item-line);background:var(--item)}
          .leaflet-container{background:var(--item);font-family:inherit}
          .maplabel{position:absolute;left:10px;bottom:10px;z-index:800;background:var(--c1);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:14px;font-weight:700;opacity:.95}
          .pin{background:transparent;border:0}
          .pin svg{display:block;filter:drop-shadow(0 2px 3px #0008);overflow:visible}
          .pin svg path{fill:#ed2939;stroke:#fff;stroke-width:1.8}
          .pin svg circle{fill:#fff}
          .pin span{display:none}
          @keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent)}70%,100%{box-shadow:0 0 0 20px transparent}}
          #status{color:var(--muted);font-size:13px;margin:12px 2px 0;min-height:18px}
          .note{color:var(--muted);font-size:12px;line-height:1.6;text-align:center;margin:18px 8px}
          .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
          a{color:var(--accent)}
          nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:8px 12px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
          nav button{flex:1;max-width:150px;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:6px 4px;border-radius:12px}
          nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
          nav button.on{color:var(--accent);background:var(--btn)}
          .gauge{position:relative;max-width:300px;margin:6px auto 0}
          .gauge svg{width:100%;display:block}
          .g-track{fill:none;stroke:var(--item-line);stroke-width:14;stroke-linecap:round}
          .g-val{fill:none;stroke:url(#gg);stroke-width:14;stroke-linecap:round;stroke-dasharray:0 100;transition:stroke-dasharray .25s linear}
          #spd{font-size:38px;font-weight:850;fill:var(--text);text-anchor:middle}
          #unit{font-size:12px;fill:var(--muted);text-anchor:middle;letter-spacing:2px}
          #phase{text-align:center;color:var(--muted);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;min-height:18px}
          .setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
          .setrow+.setrow{border-top:1px solid var(--item-line);margin-top:10px;padding-top:16px}
          .setrow b{display:block;font-size:15px}.setrow small{color:var(--muted);font-size:12px}
          .seg{display:flex;background:var(--item);border:1px solid var(--item-line);border-radius:12px;padding:3px}
          .seg button{border:0;background:none;padding:8px 12px;border-radius:9px;color:var(--muted)}
          .seg button.on{background:var(--btn);color:var(--accent)}
          .sw{position:relative;width:50px;height:30px;padding:0;border-radius:15px}
          .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .25s,background .25s}
          .sw.on{background:var(--accent);border-color:var(--accent)}.sw.on::after{transform:translateX(20px);background:#fff}
          #toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--c1);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:2000}
          #toast.show{opacity:1;transform:translate(-50%,0)}
          .noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}
          </style></head><body>
          <div class="bg"><i></i><i></i></div>
          <main>
          <header><h1 class="brand"><span>M</span>arsh <span>IP</span></h1><p class="sub">Your public IP &amp; location</p></header>

          <section class="tab on" id="t-home">
            <div class="card"><div class="eyebrow">IP ADDRESS <span class="tag">IPv4</span></div>
              <div class="iprow"><div class="ip" id="ip4">Loading…</div><button id="copy4">Copy</button></div></div>
            <div class="card"><div class="eyebrow">IP ADDRESS <span class="tag">IPv6</span></div>
              <div class="iprow"><div class="ip" id="ip6">Loading…</div><button id="copy6">Copy</button></div></div>
            <div class="card"><div class="eyebrow">WORLD MAP</div>
              <div class="mapbox"><div class="map" id="worldMap"></div><div class="maplabel" id="mapLabel">—</div></div>
              <div class="actions"><button class="primary" id="refresh">Refresh</button></div>
              <p id="status">Connecting…</p></div>
          </section>

          <section class="tab" id="t-details">
            <div class="card"><div class="eyebrow">CONNECTION &amp; LOCATION</div><div class="grid">
              <div class="item wide"><div class="label">ISP</div><div class="value" id="isp">—</div></div>
              <div class="item"><div class="label">CITY</div><div class="value" id="city">—</div></div>
              <div class="item"><div class="label">COUNTRY</div><div class="value" id="country">—</div></div>
              <div class="item wide"><div class="label">REGION</div><div class="value" id="region">—</div></div>
              <div class="item wide"><div class="label">COORDINATES</div><div class="value" id="coords">—</div></div></div></div>
            <div class="card"><div class="eyebrow">APPROXIMATE LOCATION</div>
              <div class="mapbox"><div class="map" id="cityMap"></div></div></div>
            <p class="note">IP-based location is approximate, not an exact GPS position or home address.</p>
          </section>

          <section class="tab" id="t-speed">
            <div class="card"><div class="eyebrow">INTERNET SPEED TEST</div>
              <div class="gauge"><svg viewBox="0 0 200 125">
                <defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#267caa"/><stop offset="1" stop-color="#55d6e8"/></linearGradient></defs>
                <path class="g-track" pathLength="100" d="M20 105 A80 80 0 0 1 180 105"/>
                <path class="g-val" id="gv" pathLength="100" d="M20 105 A80 80 0 0 1 180 105"/>
                <text id="spd" x="100" y="85">0</text><text id="unit" x="100" y="106">MBPS</text></svg></div>
              <div id="phase">Ready</div>
              <div class="actions" style="justify-content:center"><button class="primary" id="startTest">Start test</button></div>
              <div class="grid">
                <div class="item"><div class="label">DOWNLOAD</div><div class="value" id="rDown">—</div></div>
                <div class="item"><div class="label">UPLOAD</div><div class="value" id="rUp">—</div></div>
                <div class="item"><div class="label">PING</div><div class="value" id="rPing">—</div></div>
                <div class="item"><div class="label">JITTER</div><div class="value" id="rJit">—</div></div></div>
            </div>
            <p class="note">The test uses Cloudflare servers and transfers a few tens of MB. Mobile data charges may apply.</p>
          </section>

          <section class="tab" id="t-settings">
            <div class="card">
              <div class="setrow"><div><b>Theme</b><small>Dark, light or follow the phone</small></div>
                <div class="seg" id="themeSeg"><button data-th="dark">Dark</button><button data-th="light">Light</button><button data-th="auto">Auto</button></div></div>
              <div class="setrow"><div><b>Language</b><small>Choose the app language</small></div>
                <select id="languageSelect" aria-label="Language" style="max-width:150px;background:var(--item);color:var(--text);border:1px solid var(--item-line);border-radius:10px;padding:10px">
                  <option value="en">English (US)</option><option value="fa">فارسی</option><option value="de">Deutsch</option><option value="ru">Русский</option>
                </select></div>
              <div class="setrow"><div><b>Animations</b><small>Background, transitions and pulses</small></div><button class="sw" id="animSw"></button></div>
            </div>
            <p class="note">Marsh IP v1.1<br>Location data: ipwho.is / ipapi.co / ipinfo.io · IPs: ipify.org<br>Maps © OpenStreetMap contributors © CARTO</p>
          </section>
          </main>

          <nav id="nav">
            <button data-t="home" class="on" data-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Home</button>
            <button data-t="details" data-label="Details"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>Details</button>
            <button data-t="speed" data-label="Speed"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Speed</button>
            <button data-t="settings" data-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>Settings</button>
          </nav>
          <div id="toast"></div>
          <script src="leaflet.js"></script>
          <script>
          const $=id=>document.getElementById(id);
          const translations={
            en:{}, 
            fa:{
              "Your public IP & location":"آی‌پی عمومی و موقعیت شما","IP ADDRESS":"آدرس آی‌پی","WORLD MAP":"نقشه جهان",
              "Refresh":"بروزرسانی","Refreshing…":"در حال بروزرسانی…","Looking up your connection…":"در حال بررسی اتصال شما…",
              "CONNECTION & LOCATION":"اتصال و موقعیت","ISP":"ارائه‌دهنده اینترنت","CITY":"شهر","COUNTRY":"کشور","REGION":"استان / منطقه",
              "COORDINATES":"مختصات","APPROXIMATE LOCATION":"موقعیت تقریبی","IP-based location is approximate, not an exact GPS position or home address.":"موقعیت مبتنی بر آی‌پی تقریبی است و مکان دقیق GPS یا نشانی منزل نیست.",
              "INTERNET SPEED TEST":"تست سرعت اینترنت","Ready":"آماده","Start test":"شروع تست","DOWNLOAD":"دانلود","UPLOAD":"آپلود","PING":"پینگ","JITTER":"جیتر",
              "Theme":"پوسته","Dark, light or follow the phone":"تیره، روشن یا هماهنگ با گوشی","Animations":"انیمیشن‌ها","Background, transitions and pulses":"پس‌زمینه، جابه‌جایی‌ها و جلوه‌ها",
              "Language":"زبان","Choose the app language":"زبان برنامه را انتخاب کنید","Home":"خانه","Details":"جزئیات","Speed":"سرعت","Settings":"تنظیمات",
              "Copy":"کپی","Unavailable":"در دسترس نیست","No IPv4 detected":"IPv4 شناسایی نشد","No IPv6 on this connection":"IPv6 در این اتصال موجود نیست",
              "Could not refresh. Check your connection and try again.":"بروزرسانی انجام نشد. اتصال اینترنت را بررسی و دوباره تلاش کنید."
            },
            de:{
              "Your public IP & location":"Ihre öffentliche IP und Ihr Standort","IP ADDRESS":"IP-ADRESSE","WORLD MAP":"WELTKARTE",
              "Refresh":"Aktualisieren","Refreshing…":"Wird aktualisiert…","Looking up your connection…":"Verbindung wird gesucht…",
              "CONNECTION & LOCATION":"VERBINDUNG & STANDORT","ISP":"INTERNETANBIETER","CITY":"STADT","COUNTRY":"LAND","REGION":"REGION",
              "COORDINATES":"KOORDINATEN","APPROXIMATE LOCATION":"UNGEFÄHRER STANDORT","IP-based location is approximate, not an exact GPS position or home address.":"Der IP-basierte Standort ist ungefähr und keine genaue GPS-Position oder Wohnadresse.",
              "INTERNET SPEED TEST":"INTERNET-GESCHWINDIGKEITSTEST","Ready":"Bereit","Start test":"Test starten","DOWNLOAD":"DOWNLOAD","UPLOAD":"UPLOAD","PING":"PING","JITTER":"JITTER",
              "Theme":"Design","Dark, light or follow the phone":"Dunkel, hell oder wie auf dem Gerät","Animations":"Animationen","Background, transitions and pulses":"Hintergrund, Übergänge und Effekte",
              "Language":"Sprache","Choose the app language":"App-Sprache auswählen","Home":"Start","Details":"Details","Speed":"Geschwindigkeit","Settings":"Einstellungen",
              "Copy":"Kopieren","Unavailable":"Nicht verfügbar","No IPv4 detected":"Keine IPv4 erkannt","No IPv6 on this connection":"Kein IPv6 in dieser Verbindung",
              "Could not refresh. Check your connection and try again.":"Aktualisierung fehlgeschlagen. Verbindung prüfen und erneut versuchen."
            },
            ru:{
              "Your public IP & location":"Ваш публичный IP и местоположение","IP ADDRESS":"IP-АДРЕС","WORLD MAP":"КАРТА МИРА",
              "Refresh":"Обновить","Refreshing…":"Обновление…","Looking up your connection…":"Проверка подключения…",
              "CONNECTION & LOCATION":"ПОДКЛЮЧЕНИЕ И МЕСТОПОЛОЖЕНИЕ","ISP":"ПРОВАЙДЕР","CITY":"ГОРОД","COUNTRY":"СТРАНА","REGION":"РЕГИОН",
              "COORDINATES":"КООРДИНАТЫ","APPROXIMATE LOCATION":"ПРИБЛИЗИТЕЛЬНОЕ МЕСТОПОЛОЖЕНИЕ","IP-based location is approximate, not an exact GPS position or home address.":"Местоположение по IP приблизительное, это не точная GPS-позиция и не домашний адрес.",
              "INTERNET SPEED TEST":"ТЕСТ СКОРОСТИ ИНТЕРНЕТА","Ready":"Готово","Start test":"Начать тест","DOWNLOAD":"СКАЧИВАНИЕ","UPLOAD":"ЗАГРУЗКА","PING":"ПИНГ","JITTER":"ДЖИТТЕР",
              "Theme":"Тема","Dark, light or follow the phone":"Тёмная, светлая или как на устройстве","Animations":"Анимация","Background, transitions and pulses":"Фон, переходы и эффекты",
              "Language":"Язык","Choose the app language":"Выберите язык приложения","Home":"Главная","Details":"Подробности","Speed":"Скорость","Settings":"Настройки",
              "Copy":"Копировать","Unavailable":"Недоступно","No IPv4 detected":"IPv4 не обнаружен","No IPv6 on this connection":"IPv6 в этом подключении отсутствует",
              "Could not refresh. Check your connection and try again.":"Не удалось обновить. Проверьте подключение и повторите попытку."
            }
          };
          Object.keys(translations).forEach(lang=>{if(lang!=="en")Object.assign(translations[lang],{'Details': 'جزئیات', 'WORLD MAP': 'نقشه جهان', 'IP ADDRESS': 'آدرس آی\u200cپی', 'Nothing to copy': 'موردی برای کپی وجود ندارد', 'Copied': 'کپی شد', 'Copy is unavailable': 'امکان کپی وجود ندارد', 'Testing…': 'در حال آزمایش…', 'Test again': 'آزمایش دوباره', 'Measuring ping': 'اندازه\u200cگیری پینگ', 'Download': 'دانلود', 'Upload': 'آپلود', 'Done': 'تمام شد', 'Failed': 'ناموفق', 'Test failed — check your connection': 'آزمایش ناموفق بود؛ اتصال اینترنت را بررسی کنید', 'Could not reach IP services. Turn off VPN or change network, then refresh.': 'ارتباط با سرویس\u200cهای IP برقرار نشد. VPN را خاموش کنید یا شبکه را تغییر دهید و دوباره بروزرسانی کنید.', 'IP detected; location details are unavailable.': 'آی\u200cپی شناسایی شد؛ جزئیات موقعیت در دسترس نیست.', 'Loaded using ': 'دریافت اطلاعات با استفاده از ', 'MBPS': 'مگابیت\u200cبرثانیه'} );});
          Object.assign(translations.de,{'Nothing to copy': 'Nichts zum Kopieren', 'Copied': 'Kopiert', 'Copy is unavailable': 'Kopieren nicht verfügbar', 'Testing…': 'Test läuft…', 'Test again': 'Erneut testen', 'Measuring ping': 'Ping wird gemessen', 'Download': 'Download', 'Upload': 'Upload', 'Done': 'Fertig', 'Failed': 'Fehlgeschlagen', 'Test failed — check your connection': 'Test fehlgeschlagen – Verbindung prüfen', 'Could not reach IP services. Turn off VPN or change network, then refresh.': 'IP-Dienste nicht erreichbar. VPN ausschalten oder Netzwerk wechseln und erneut aktualisieren.', 'IP detected; location details are unavailable.': 'IP erkannt; Standortdetails sind nicht verfügbar.', 'Loaded using ': 'Daten geladen über ', 'MBPS': 'Mbit/s'});
          Object.assign(translations.ru,{'Nothing to copy': 'Нечего копировать', 'Copied': 'Скопировано', 'Copy is unavailable': 'Копирование недоступно', 'Testing…': 'Идёт тест…', 'Test again': 'Повторить тест', 'Measuring ping': 'Измерение пинга', 'Download': 'Скачивание', 'Upload': 'Отправка', 'Done': 'Готово', 'Failed': 'Ошибка', 'Test failed — check your connection': 'Тест не удался — проверьте подключение', 'Could not reach IP services. Turn off VPN or change network, then refresh.': 'Нет доступа к IP-сервисам. Отключите VPN или смените сеть и обновите данные.', 'IP detected; location details are unavailable.': 'IP обнаружен; данные о местоположении недоступны.', 'Loaded using ': 'Данные получены через ', 'MBPS': 'Мбит/с'});
          const tr=(text)=>((translations[S.lang]||{})[text]||text);
          const originalTextNodes=new WeakMap();
          function applyLanguage(){
            const lang=S.lang||"en";
            document.documentElement.lang=lang;
            document.documentElement.dir=lang==="fa"?"rtl":"ltr";
            const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
            let node;
            while((node=walker.nextNode())){
              if(!originalTextNodes.has(node))originalTextNodes.set(node,node.nodeValue);
              const original=originalTextNodes.get(node);
              const clean=original.trim();
              const translated=tr(clean);
              if(translated!==clean){
                const leading=original.match(/^\\s*/)?.[0]||"";
                const trailing=original.match(/\\s*$/)?.[0]||"";
                node.nodeValue=leading+translated+trailing;
              }else if(lang==="en"){node.nodeValue=original;}
            }
            $("languageSelect").value=lang;
            if(lang==="fa"){document.body.style.fontFamily="Tahoma, system-ui, sans-serif";}
            else{document.body.style.fontFamily="system-ui, sans-serif";}
          }
          const S={theme:"dark",anim:true,lang:"en"};
          try{Object.assign(S,JSON.parse(localStorage.getItem("marship")||"{}"));}catch(e){}
          const save=()=>{try{localStorage.setItem("marship",JSON.stringify(S));}catch(e){}};
          const maps={};
          const tileUrl=()=>"https://{s}.basemaps.cartocdn.com/"+(document.documentElement.dataset.theme==="light"?"light_all":"dark_all")+"/{z}/{x}/{y}{r}.png";
          function initMap(key,el){
            if(typeof L==="undefined")return;
            const m=L.map(el,{zoomControl:false,worldCopyJump:true,minZoom:1,maxBounds:[[-85,-180],[85,180]],maxBoundsViscosity:0.7}).setView(key==="world"?[20,0]:[25,10],key==="world"?2:2);
            const tiles=L.tileLayer(tileUrl(),{subdomains:"abcd",maxZoom:18,attribution:"© OSM © CARTO"}).addTo(m);
            maps[key]={m,tiles,marker:null,circle:null};
          }
          function applyTheme(){
            let t=S.theme;
            if(t==="auto")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";
            document.documentElement.dataset.theme=t;
            document.body.classList.toggle("noanim",!S.anim);
            for(const k in maps)maps[k].tiles.setUrl(tileUrl());
            document.querySelectorAll("#themeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.th===S.theme));
            $("animSw").classList.toggle("on",S.anim);
          }
          function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1800);}
          function tab(n){
            document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("on",e.id==="t-"+n));
            document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===n));
            window.scrollTo(0,0);
            setTimeout(()=>{for(const k in maps)maps[k].m.invalidateSize();},80);
          }
          async function copyText(t){
            if(!t){toast(tr("Nothing to copy"));return;}
            try{await navigator.clipboard.writeText(t);toast(tr("Copied"));return;}catch(e){}
            try{const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();toast(tr("Copied"));}
            catch(e){toast(tr("Copy is unavailable"));}
          }
          async function getJson(url,ms=9000){
            const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
            try{const r=await fetch(url,{cache:"no-store",signal:c.signal});if(!r.ok)throw Error("HTTP "+r.status);return await r.json();}
            finally{clearTimeout(t);}
          }
          const flag=cc=>cc&&cc.length===2?String.fromCodePoint(...[...cc.toUpperCase()].map(c=>127397+c.charCodeAt(0))):"";
          const val=(id,v)=>{$(id).textContent=(v===null||v===undefined||v==="")?tr("Unavailable"):v;};

          const providers=[
            ["ipwho.is",async()=>{const d=await getJson("https://ipwho.is/");if(!d.success)throw Error("fail");const c=d.connection||{};return{ip:d.ip,city:d.city,country:d.country,cc:d.country_code,region:d.region,lat:d.latitude,lon:d.longitude,isp:c.isp||c.org};}],
            ["ipapi.co",async()=>{const d=await getJson("https://ipapi.co/json/");if(d.error||!d.ip)throw Error("fail");return{ip:d.ip,city:d.city,country:d.country_name,cc:d.country_code,region:d.region,lat:d.latitude,lon:d.longitude,isp:d.org};}],
            ["ipinfo.io",async()=>{const d=await getJson("https://ipinfo.io/json");if(!d.ip)throw Error("fail");const p=(d.loc||"").split(",");return{ip:d.ip,city:d.city,country:d.country,cc:d.country,region:d.region,lat:Number(p[0]),lon:Number(p[1]),isp:d.org};}]
          ];
          async function geo(){
            for(const [name,fn] of providers){try{const d=await fn();d.provider=name;return d;}catch(e){console.warn(name,e);}}
            return null;
          }
          function setMarker(key,lat,lon,zoom,radius){
            const o=maps[key];if(!o)return;
            const ll=[lat,lon];
            if(o.marker)o.marker.setLatLng(ll);
            else o.marker=L.marker(ll,{icon:L.divIcon({className:"pin",html:'<svg width="34" height="42" viewBox="0 0 34 42" aria-hidden="true"><path d="M17 1C8.2 1 1 8.1 1 16.8 1 28 17 41 17 41S33 28 33 16.8C33 8.1 25.8 1 17 1Z"/><circle cx="17" cy="16" r="6"/></svg>',iconSize:[34,42],iconAnchor:[17,41]}),interactive:false}).addTo(o.m);
            if(radius){if(o.circle)o.circle.setLatLng(ll);else o.circle=L.circle(ll,{radius,color:"#55d6e8",weight:1,fillOpacity:.12}).addTo(o.m);}
            if(key==="world"){o.m.setView([20,0],2,{animate:false});}
            else{o.m.flyTo(ll,zoom,{duration:S.anim?1.4:0});}
          }
          let ip4=null,ip6=null;
          async function load(){
            const refreshButton=$("refresh");
            if(refreshButton.disabled)return;
            $("status").textContent=tr("Looking up your connection…");
            refreshButton.disabled=true;
            refreshButton.textContent=tr("Refreshing…");
            try{
            const p4=getJson("https://api.ipify.org?format=json",7000).then(d=>d.ip).catch(()=>null);
            const p6=getJson("https://api6.ipify.org?format=json",7000).then(d=>d.ip).catch(()=>null);
            const [a,b,g]=await Promise.all([p4,p6,geo()]);
            ip4=a||(g&&g.ip&&g.ip.includes(".")?g.ip:null);
            ip6=b||(g&&g.ip&&g.ip.includes(":")?g.ip:null);
            [["ip4",ip4,"No IPv4 detected"],["ip6",ip6,"No IPv6 on this connection"]].forEach(([id,v,empty])=>{$(id).textContent=v||empty;$(id).classList.toggle("dim",!v);});
            if(g){
              val("isp",g.isp);val("city",g.city);val("country",(flag(g.cc)+" "+(g.country||"")).trim());val("region",g.region);
              $("mapLabel").textContent=(flag(g.cc)+" "+(g.country||"Unknown")).trim();
              if(Number.isFinite(g.lat)&&Number.isFinite(g.lon)){
                val("coords",g.lat.toFixed(5)+", "+g.lon.toFixed(5));
                setMarker("world",g.lat,g.lon,3);setMarker("city",g.lat,g.lon,9,20000);
              }else val("coords",null);
              $("status").textContent=tr("Loaded using ")+g.provider+".";
            }else{
              ["isp","city","country","region","coords"].forEach(i=>val(i,null));
              $("mapLabel").textContent="Unavailable";
              $("status").textContent=(ip4||ip6)?tr("IP detected; location details are unavailable."):tr("Could not reach IP services. Turn off VPN or change network, then refresh.");
            }
            }catch(err){
              console.error("Refresh failed",err);
              $("status").textContent=tr("Could not refresh. Check your connection and try again.");
            }finally{
              refreshButton.disabled=false;
              refreshButton.textContent=tr("Refresh");
            }
          }

          /* ---------- speed test (Cloudflare) ---------- */
          const CF="https://speed.cloudflare.com/";
          const arc=v=>Math.min(1,Math.log10(1+v)/Math.log10(501))*100;
          let shown=0;
          function gauge(v){shown=shown*.6+v*.4;$("spd").textContent=shown<10?shown.toFixed(1):Math.round(shown);$("gv").style.strokeDasharray=arc(shown)+" 100";}
          const fmt=v=>(v<10?v.toFixed(2):v.toFixed(1))+" Mbps";
          async function pingTest(){
            const t=[];
            for(let i=0;i<8;i++){const s=performance.now();try{await fetch(CF+"__down?bytes=0&r="+Math.random(),{cache:"no-store"});t.push(performance.now()-s);}catch(e){}}
            if(t.length<3)throw Error("ping");
            t.shift();
            const jit=t.slice(1).reduce((a,x,i)=>a+Math.abs(x-t[i]),0)/(t.length-1);
            return{ping:Math.min(...t),jitter:jit};
          }
          async function downTest(){
            const ac=new AbortController();let bytes=0,last=0;const start=performance.now();let lastT=start,t0=null,b0=0;
            const worker=async()=>{try{while(!ac.signal.aborted){const r=await fetch(CF+"__down?bytes=25000000&r="+Math.random(),{cache:"no-store",signal:ac.signal});const rd=r.body.getReader();for(;;){const x=await rd.read();if(x.done)break;bytes+=x.value.length;}}}catch(e){}};
            worker();worker();worker();
            await new Promise(res=>{const iv=setInterval(()=>{const n=performance.now();if(n-start>1000&&t0===null){t0=n;b0=bytes;}
              gauge((bytes-last)*8/((n-lastT)/1000)/1e6);last=bytes;lastT=n;if(n-start>9000){clearInterval(iv);res();}},200);});
            const n=performance.now();ac.abort();
            return t0?(bytes-b0)*8/((n-t0)/1000)/1e6:bytes*8/((n-start)/1000)/1e6;
          }
          async function upTest(){
            const blob=new Blob([new Uint8Array(4000000)]);
            const start=performance.now();let sent=0,last=0,lastT=start,stop=false;const xs=[];
            const post=()=>new Promise(res=>{const x=new XMLHttpRequest();xs.push(x);let prev=0;
              x.open("POST",CF+"__up");
              x.upload.onprogress=e=>{sent+=e.loaded-prev;prev=e.loaded;};
              x.onload=x.onerror=x.onabort=()=>res();x.send(blob);});
            const worker=async()=>{while(!stop)await post();};
            worker();worker();
            await new Promise(res=>{const iv=setInterval(()=>{const n=performance.now();
              gauge((sent-last)*8/((n-lastT)/1000)/1e6);last=sent;lastT=n;if(n-start>8000){clearInterval(iv);res();}},200);});
            const n=performance.now();stop=true;xs.forEach(x=>x.abort());
            return sent*8/((n-start)/1000)/1e6;
          }
          let running=false;
          async function runTest(){
            if(running)return;running=true;
            const btn=$("startTest");btn.disabled=true;btn.textContent=tr("Testing…");
            ["rDown","rUp","rPing","rJit"].forEach(i=>$(i).textContent="—");
            shown=0;gauge(0);
            try{
              $("phase").textContent=tr("Measuring ping");
              const p=await pingTest();$("rPing").textContent=p.ping.toFixed(0)+" ms";$("rJit").textContent=p.jitter.toFixed(1)+" ms";
              $("phase").textContent=tr("Download");const d=await downTest();$("rDown").textContent=fmt(d);shown=d;gauge(d);
              $("phase").textContent=tr("Upload");shown=0;
              try{const u=await upTest();$("rUp").textContent=fmt(u);}catch(e){$("rUp").textContent="Failed";}
              $("phase").textContent=tr("Done");
            }catch(e){$("phase").textContent=tr("Test failed — check your connection");}
            btn.disabled=false;btn.textContent=tr("Test again");running=false;
          }

          /* ---------- wiring ---------- */
          document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>tab(b.dataset.t));
          document.querySelectorAll("#themeSeg button").forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;save();applyTheme();});
          $("animSw").onclick=()=>{S.anim=!S.anim;save();applyTheme();};
          $("languageSelect").onchange=()=>{S.lang=$("languageSelect").value;save();applyLanguage();};
          $("copy4").onclick=()=>copyText(ip4);
          $("copy6").onclick=()=>copyText(ip6);
          $("refresh").onclick=load;
          $("startTest").onclick=runTest;
          matchMedia("(prefers-color-scheme: light)").addEventListener&&matchMedia("(prefers-color-scheme: light)").addEventListener("change",()=>{if(S.theme==="auto")applyTheme();});
          initMap("world","worldMap");initMap("city","cityMap");
          applyTheme();applyLanguage();load();
          </script></body></html>
          EOF

      # Download Leaflet (map library) at build time so it is bundled inside the APK
      - name: Download Leaflet
        shell: bash
        run: |
          A=android/app/src/main/assets
          curl -fsSL https://unpkg.com/leaflet@1.9.4/dist/leaflet.js -o $A/leaflet.js || curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js -o $A/leaflet.js
          curl -fsSL https://unpkg.com/leaflet@1.9.4/dist/leaflet.css -o $A/leaflet.css || curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css -o $A/leaflet.css
          test -s $A/leaflet.js && test -s $A/leaflet.css

      # Pin the build to Java 17; Gradle 8.9 / Android Gradle Plugin 8.7.3
      # cannot run with the Java 25 runtime that caused the previous failure.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          build-root-directory: android
          arguments: assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marsh-IP-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
