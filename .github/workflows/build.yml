name: Build Marsh IP APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/marship
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/assets

          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MarshIP"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.marship'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.marship'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:theme="@style/AppTheme" android:label="Marsh IP" android:icon="@drawable/ic_launcher" android:usesCleartextTraffic="false" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF


          cat > android/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#090D18" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#55D6E8" android:pathData="M22,78V30h10l22,29 22,-29h10v48h-12V49L54,72 34,49v29z"/>
          </vector>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#55D6E8</item>
                  <item name="android:statusBarColor">#090D18</item>
                  <item name="android:navigationBarColor">#090D18</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/java/com/marship/MainActivity.java <<'EOF'
          package com.marship;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          cat > android/app/src/main/assets/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="theme-color" content="#090d18"><title>Marsh IP</title>
          <style>
          :root{color-scheme:dark;--bg:#090d18;--line:#263247;--muted:#94a3b8;--white:#f8fafc;--cyan:#55d6e8}
          *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#1b3155 0,transparent 55%),var(--bg);color:var(--white);font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:28px 16px}
          main{width:min(100%,620px)}header{text-align:center;margin:14px 0 28px}.brand{font-size:clamp(32px,8vw,48px);font-weight:850;letter-spacing:-2px;margin:0}.brand span{color:var(--cyan)}.sub{color:var(--muted);margin:8px 0 0;font-size:14px;letter-spacing:2px;text-transform:uppercase}
          .card{background:linear-gradient(145deg,#162135f5,#0e1523fa);border:1px solid var(--line);border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 18px 55px #0005}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:1.8px;font-weight:700}.iprow{display:flex;align-items:center;gap:12px;margin-top:10px}#ip{font-size:clamp(25px,7vw,36px);font-weight:800;overflow-wrap:anywhere;flex:1}
          button{border:1px solid #3a4c69;background:#1b2a43;color:#eaf5ff;border-radius:12px;padding:11px 14px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.item{background:#0b1322;border:1px solid #202d42;border-radius:15px;padding:15px;min-width:0}.label{font-size:11px;color:var(--muted);letter-spacing:1.4px;font-weight:700}.value{font-size:18px;font-weight:700;margin-top:8px;overflow-wrap:anywhere}.wide{grid-column:1/-1}.coords{font-size:15px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.primary{background:linear-gradient(100deg,#267caa,#4c70d8);border:0}#status{color:var(--muted);font-size:13px;margin:14px 2px 0;min-height:20px}.note{color:#8998ad;font-size:12px;line-height:1.6;text-align:center;margin:20px 8px}a{color:#8bd9ed}
          </style></head><body><main>
          <header><h1 class="brand"><span>M</span>arsh <span>IP</span></h1><p class="sub">Your public IP &amp; location</p></header>
          <section class="card"><div class="eyebrow">IP ADDRESS</div><div class="iprow"><div id="ip">Loading…</div><button id="copyIp">Copy</button></div></section>
          <section class="card"><div class="eyebrow">IP LOCATION</div><div class="grid">
          <div class="item"><div class="label">CITY</div><div class="value" id="city">—</div></div>
          <div class="item"><div class="label">COUNTRY</div><div class="value" id="country">—</div></div>
          <div class="item wide"><div class="label">REGION</div><div class="value" id="region">—</div></div>
          <div class="item wide"><div class="label">COORDINATES</div><div class="value coords" id="coords">—</div></div></div>
          <div class="actions"><button class="primary" id="refresh">Refresh location</button><button id="map" disabled>Open map</button></div><p id="status">Connecting to location service…</p></section>
          <p class="note">IP-based location is approximate, not an exact GPS or home address. Data provided by <a href="https://ipapi.co/" target="_blank">ipapi.co</a>.</p>
          </main><script>
          const $=id=>document.getElementById(id);
          let coords=null;
          const show=(id,v)=>$(id).textContent=(v===null||v===undefined||v==="")?"Unavailable":v;
          async function getJson(url){
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),9000);
            try{
              const response=await fetch(url,{cache:"no-store",signal:controller.signal});
              if(!response.ok) throw new Error("HTTP "+response.status);
              return await response.json();
            } finally { clearTimeout(timer); }
          }
          async function load(){
            $("status").textContent="Trying location services…";
            $("refresh").disabled=true; $("map").disabled=true; coords=null;
            let data=null, provider="";
            const providers=[
              async()=>{const d=await getJson("https://ipwho.is/");if(!d.success)throw Error(d.message||"ipwho.is failed");return {ip:d.ip,city:d.city,country:d.country,region:d.region,lat:d.latitude,lon:d.longitude};},
              async()=>{const d=await getJson("https://ipapi.co/json/");if(d.error||!d.ip)throw Error("ipapi.co failed");return {ip:d.ip,city:d.city,country:d.country_name,region:d.region,lat:d.latitude,lon:d.longitude};},
              async()=>{const d=await getJson("https://ipinfo.io/json");if(!d.ip)throw Error("ipinfo failed");const p=(d.loc||"").split(",");return {ip:d.ip,city:d.city,country:d.country,region:d.region,lat:Number(p[0]),lon:Number(p[1])};}
            ];
            for(let n=0;n<providers.length;n++){
              try{data=await providers[n]();provider=["ipwho.is","ipapi.co","ipinfo.io"][n];break;}
              catch(e){console.warn("Location provider failed",n,e);}
            }
            if(!data){
              try{const d=await getJson("https://api.ipify.org?format=json");if(d.ip)data={ip:d.ip};}
              catch(e){console.warn("IP fallback failed",e);}
            }
            if(data && data.ip){
              show("ip",data.ip);show("city",data.city);show("country",data.country);show("region",data.region);
              if(Number.isFinite(data.lat)&&Number.isFinite(data.lon)){
                coords=[data.lat,data.lon];show("coords",`${data.lat.toFixed(5)}, ${data.lon.toFixed(5)}`);$("map").disabled=false;
              }else show("coords","Unavailable");
              $("status").textContent=provider?`Location loaded using ${provider}.`:"IP detected; location details are temporarily unavailable.";
            }else{
              show("ip","Unavailable");show("city","Unavailable");show("country","Unavailable");show("region","Unavailable");show("coords","Unavailable");
              $("status").textContent="Could not reach IP services. Try turning off VPN or changing network, then refresh.";
            }
            $("refresh").disabled=false;
          }
          $("refresh").onclick=load;
          $("copyIp").onclick=async()=>{try{await navigator.clipboard.writeText($("ip").textContent);$("status").textContent="IP address copied.";}catch(e){$("status").textContent="Copy is unavailable in this browser.";}};
          $("map").onclick=()=>{if(coords)window.open(`https://www.openstreetmap.org/?mlat=${coords[0]}&mlon=${coords[1]}#map=12/${coords[0]}/${coords[1]}`,"_blank");};
          load();
          </script></body></html>
          EOF

      # Pin the build to Java 17; Gradle 8.9 / Android Gradle Plugin 8.7.3
      # cannot run with the Java 25 runtime that caused the previous failure.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          build-root-directory: android
          arguments: assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marsh-IP-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
